[package]
name = "ai-agent-v3"
version = "0.1.0"
edition = "2021"
description = "A Rust-based autonomous computer agent"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
ureq = { version = "2.9", default-features = false, features = ["json"] }

[dev-dependencies]
tempfile = "=3.3"
minicbor = "0.20"
# No httpmock or reqwest to avoid dlltool issues on Windows GNU/MSVC environment without C toolchain
